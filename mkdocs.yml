# [Info]
site_name: 月全食的笔记本
site_url: https://eclipseyue.github.io
site_description: 个人网站文档

# [Navigation]
nav:
  - 个人:
    - 个人介绍: ME/profile.md
  
  - 笔记:
    - 笔记导航: Note/index.md
    - 编译原理: 
      - 课程信息: Note/complie.md
      - 词法分析: Note/lexical_analysis.md
      - 语法分析: Note/syntax_analysis.md

theme:
  name: material
  icon:
    logo: material/book-open-page-variant  # 网站 Logo
    repo: fontawesome/brands/github        # 仓库图标

  favicon: assets/favicon.png              # 网站图标
  palette:
    # 亮色主题
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式

    # 暗色主题
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.top
    - navigation.tabs
    - navigation.sections

  # 导航栏设置
  nav_style: dark          # 导航栏样式
  collapse_navigation: true # 折叠导航
  sticky_navigation: true  # 固定导航
  

markdown_extensions:
  - admonition
  - footnotes
  - meta
  - toc:
      permalink: true
  - codehilite:
      guess_lang: false
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist
  # - pymdownx.emoji

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

plugins:
  - search


